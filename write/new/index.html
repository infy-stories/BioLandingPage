<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Write an anonymous story with a live Instagram preview.">
  <title>Latest Story Experience | Infy Stories</title>
  <script>
    let entryMode = null;
    try {
      const entry = JSON.parse(sessionStorage.getItem('storyEditorEntry') || 'null');
      sessionStorage.removeItem('storyEditorEntry');
      if (entry && ['user', 'admin'].includes(entry.mode)
          && Date.now() - entry.created >= 0 && Date.now() - entry.created <= 300000) {
        entryMode = entry.mode;
      }
    } catch {}
    if (!entryMode && document.referrer) {
      try {
        const source = new URL(document.referrer);
        const path = source.pathname.replace(/\/+$/, '').toLowerCase();
        if (source.origin === location.origin) {
          if (/(^|\/)aboutus(?:\.html)?$/.test(path)) entryMode = 'admin';
          if (/(^|\/)writeconfessionrules(?:\.html)?$/.test(path)) entryMode = 'user';
        }
      } catch {}
    }
    if (!entryMode && ['reload', 'back_forward'].includes(performance.getEntriesByType('navigation')[0]?.type)
        && ['user', 'admin'].includes(history.state?.storyEntryMode)) {
      entryMode = history.state.storyEntryMode;
    }
    window.storyAdminEntry = entryMode === 'admin';
    window.storyEntryAllowed = Boolean(entryMode);
    if (window.storyEntryAllowed) history.replaceState({ ...history.state, storyEntryMode: entryMode }, '');
    if (!window.storyEntryAllowed) window.location.replace('../../index.html');
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q3SY8F9P01"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-Q3SY8F9P01');
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="./new-story.css">
  <link rel="icon" href="../../res/logoBig-noBg.png" type="image/icon type">
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="../../script.js"></script>
  <script defer src="./newStory.js"></script>
</head>

<body class="new-story-page">
  <header>
    <h1 onclick="location.href='../../index.html';" class="logo">Infy Stories</h1>
    <div class="nav-links">
      <ul>
        <li onclick="location.href='../../index.html';">Home</li>
        <li onclick="location.href='../../imageCollection.html';">Photos</li>
        <li onclick="location.href='../../aboutUs.html';">About Us</li>
      </ul>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="new-story-shell">
    <div class="new-story-heading">
      <p class="choice-eyebrow">INFY STORIES</p>
      <h2>Write Your Story</h2>
      <p>Your story stays anonymous. The preview updates as you write.</p>
    </div>

    <div class="new-story-layout">
      <section class="story-compose" aria-label="Story details">
        <form id="storyForm" novalidate>
          <label for="ageGender">Age / gender <span>(optional)</span></label>
          <input id="ageGender" name="age_gender" type="text" maxlength="80" placeholder="24/F" autocomplete="off">

          <label for="storyText">Your story</label>
          <textarea id="storyText" name="story" data-allow-unicode placeholder="Write away your thoughts..." spellcheck="true"></textarea>
          <div class="story-input-meta">
            <span id="characterCount" aria-live="polite">2000 characters remaining</span>
            <span id="storyError" class="story-error" role="alert"></span>
          </div>

          <fieldset class="palette-settings">
            <legend class="palette-heading">
              <span>Palette</span>
              <button class="preview-arrow" id="randomPalette" type="button" aria-label="Random palette" title="Random palette">
                <i class="fas fa-random" aria-hidden="true"></i>
              </button>
            </legend>
            <div class="theme-options" id="themeOptions" role="group" aria-label="Palette"></div>
          </fieldset>

          <div class="admin-settings" id="adminSettings" hidden>
            <label for="storyDateTime">Slide date / time <span>(IST)</span></label>
            <input id="storyDateTime" name="story_datetime" type="datetime-local" step="60">
          </div>
        </form>

        <section class="submission-success" id="submissionSuccess" hidden>
          <h3>Story submitted successfully.</h3>
          <p>Your story has been received.</p>
        </section>

        <section class="title-suggestions" id="titleSuggestions" hidden aria-label="AI title suggestions">
          <h3>Suggested titles</h3>
          <p id="titleGenerationStatus" class="submit-status" role="status"></p>
          <button id="retryTitles" type="button" class="preview-arrow title-retry" aria-label="Retry title generation" title="Retry title generation" hidden>
            <i class="fas fa-redo" aria-hidden="true"></i>
          </button>
          <form id="titleForm" hidden>
            <fieldset class="title-options">
              <legend>Choose a title</legend>
              <div id="titleOptions"></div>
            </fieldset>
            <button id="submitTitle" type="submit" class="btn btn-primary title-action-button" disabled>
              <i class="fas fa-paper-plane" aria-hidden="true"></i>
              <span>Send title slide</span>
            </button>
          </form>
          <p id="titleDeliveryStatus" class="submit-status" role="status"></p>
        </section>
      </section>

      <section class="story-preview-panel" aria-label="Live story preview">
        <div class="preview-heading">
          <h3>Live preview</h3>
        </div>
        <div class="preview-tabs" id="previewTabs" role="group" aria-label="Preview view" hidden>
          <button id="previewTitle" type="button" aria-pressed="false">Title</button>
          <button id="previewStory" type="button" aria-pressed="true">Story</button>
        </div>
        <div class="preview-viewport" id="previewViewport">
          <div class="preview-stage" id="previewStage"></div>
        </div>
        <div class="preview-navigation">
          <button class="preview-arrow" id="previousSlide" type="button" aria-label="Previous slide" title="Previous slide" disabled>
            <i class="fas fa-chevron-left" aria-hidden="true"></i>
          </button>
          <span id="slidePosition" aria-live="polite">1 / 1</span>
          <button class="preview-arrow" id="nextSlide" type="button" aria-label="Next slide" title="Next slide" disabled>
            <i class="fas fa-chevron-right" aria-hidden="true"></i>
          </button>
        </div>
      </section>

      <div class="story-submit-controls">
        <label class="generate-titles-choice" for="generateTitles">
          <input id="generateTitles" name="generate_titles" type="checkbox" form="storyForm" checked>
          <span>Generate Titles for my story</span>
        </label>
        <button class="btn btn-primary submit-story-button" id="submitStory" type="submit" form="storyForm">Submit Story</button>
        <p class="submit-status" id="submitStatus" role="status" aria-live="polite"></p>
      </div>

      <div class="story-home-controls" id="storyHomeControls" hidden>
        <button type="button" class="btn btn-secondary title-action-button" onclick="location.href='../../index.html';">
          <i class="fas fa-home" aria-hidden="true"></i>
          <span>Home</span>
        </button>
      </div>
    </div>
  </main>

  <div id="measurementHost" aria-hidden="true"></div>
</body>

</html>
