<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Choose how you would like to write your anonymous story.">
  <title>Write Your Story | Infy Stories</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q3SY8F9P01"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-Q3SY8F9P01');
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./write/new/new-story.css">
  <link rel="icon" href="./res/logoBig-noBg.png" type="image/icon type">
  <script src="./script.js"></script>
  <script defer src="./choice.js"></script>
</head>

<body>
  <header>
    <h1 onclick="location.href='index.html';" class="logo">Infy Stories</h1>
    <div class="nav-links">
      <ul>
        <li onclick="location.href='index.html';">Home</li>
        <li onclick="location.href='imageCollection.html';">Photos</li>
        <li onclick="location.href='aboutUs.html';">About Us</li>
      </ul>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="experience-choice">
    <p class="choice-eyebrow">INFY STORIES</p>
    <h2>Write Your Story</h2>
    <p class="choice-intro">Choose the way you would like to share it.</p>

    <div class="experience-options">
      <section class="experience-option glass-panel">
        <span class="option-mark" aria-hidden="true"><i class="fas fa-eye"></i></span>
        <h3>Write with the latest experience</h3>
        <p>See a live Instagram preview as your story takes shape.</p>
        <button class="btn btn-primary" type="button" onclick="chooseExperience('new')">Try latest experience</button>
      </section>

      <section class="experience-option glass-panel">
        <span class="option-mark option-mark-legacy" aria-hidden="true"><i class="fas fa-pen"></i></span>
        <h3>I just want to write</h3>
        <p>Continue with the existing story form.</p>
        <div class="choice-auto-open">
          <div class="choice-progress-track" role="progressbar" aria-label="Existing form opens automatically" aria-valuemin="0" aria-valuemax="100" aria-valuetext="The existing form opens automatically when the bar fills">
            <div class="choice-progress-fill" id="choiceProgress"></div>
          </div>
          <span>Opens automatically</span>
        </div>
        <button class="btn btn-secondary" type="button" onclick="chooseExperience('legacy')">Continue</button>
      </section>
    </div>
  </main>
</body>

</html>
